<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسابقة صور Tropicfeel Arabia — صوّت الآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101410; --paper:#f7f6f2; --card:#ffffff; --accent:#c8f566; --muted:#7a7f76; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Tajawal',sans-serif; background:var(--paper); color:var(--ink); }
  header { background:var(--ink); color:#fff; padding:34px 20px 30px; text-align:center; }
  .logo { font-weight:800; font-size:26px; letter-spacing:4px; text-transform:uppercase; }
  .logo span { color:var(--accent); }
  header h1 { font-size:20px; font-weight:700; margin-top:12px; }
  header p { color:#c9cdc4; font-size:14px; margin-top:6px; }
  .bar { background:var(--accent); color:var(--ink); text-align:center; font-size:13px; font-weight:700; padding:8px 16px; }
  main { max-width:1080px; margin:0 auto; padding:28px 16px 60px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; }
  .card { background:var(--card); border-radius:16px; overflow:hidden; box-shadow:0 2px 10px rgba(16,20,16,.07); display:flex; flex-direction:column; }
  .ph { position:relative; aspect-ratio:4/5; background:#e8e7e2; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .code { position:absolute; top:10px; inset-inline-start:10px; background:var(--ink); color:var(--accent); font-weight:800; font-size:13px; padding:4px 10px; border-radius:999px; letter-spacing:1px; }
  .row { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; gap:10px; }
  .votes { font-size:14px; color:var(--muted); font-weight:500; }
  .votes b { color:var(--ink); font-size:17px; font-weight:800; margin-inline-end:4px; }
  button.vote { font-family:inherit; font-size:14px; font-weight:700; border:none; cursor:pointer; background:var(--ink); color:#fff; padding:9px 18px; border-radius:999px; transition:.15s; }
  button.vote:hover:not(:disabled){ background:#2a2f28; }
  button.vote:disabled { background:var(--accent); color:var(--ink); cursor:default; }
  .empty { text-align:center; color:var(--muted); padding:60px 0; font-size:15px; }
  footer { text-align:center; color:var(--muted); font-size:13px; padding:24px; }
  footer a { color:var(--ink); font-weight:700; text-decoration:none; }
</style>
</head>
<body>
<header>
  <div class="logo">Tropicfeel <span>Arabia</span></div>
  <h1>مسابقة الصور</h1>
  <p>صوّت لصورتك المفضلة — التصويت مفتوح للجميع</p>
</header>
<div class="bar">كل صورة برقم مشاركة فقط، وعدد الأصوات محدّث لحظياً</div>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">لا توجد مشاركات بعد</div>
</main>
<footer>تابعونا على انستغرام <a href="https://instagram.com/tropicfeelar" target="_blank">@tropicfeelar</a></footer>
<script>
const voted = new Set(JSON.parse(localStorage.getItem('tf_voted') || '[]'));
const grid = document.getElementById('grid');

function card(p) {
  const done = voted.has(p.id);
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.id = p.id;
  el.innerHTML =
    '<div class="ph"><span class="code">#' + p.code + '</span><img loading="lazy" alt="مشاركة رقم ' + p.code + '" src="' + p.url + '"></div>' +
    '<div class="row"><span class="votes"><b>' + p.votes + '</b>صوت</span>' +
    '<button class="vote" ' + (done ? 'disabled' : '') + '>' + (done ? '✓ تم التصويت' : 'صوّت') + '</button></div>';
  el.querySelector('button').onclick = () => vote(p.id, el);
  return el;
}

async function vote(id, el) {
  const btn = el.querySelector('button.vote');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  try {
    const r = await fetch('/api/vote', { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ id }) });
    const d = await r.json();
    if (!r.ok) throw 0;
    el.querySelector('.votes b').textContent = d.votes;
    btn.textContent = '✓ تم التصويت';
    voted.add(id);
    localStorage.setItem('tf_voted', JSON.stringify([...voted]));
  } catch { btn.disabled = false; }
}

async function load() {
  const r = await fetch('/api/data');
  const photos = await r.json();
  grid.innerHTML = '';
  document.getElementById('empty').style.display = photos.length ? 'none' : 'block';
  photos.forEach(p => grid.appendChild(card(p)));
}

async function refreshCounts() {
  try {
    const photos = await (await fetch('/api/data')).json();
    if (photos.length !== grid.children.length) return load();
    photos.forEach(p => {
      const el = grid.querySelector('[data-id="' + p.id + '"]');
      if (el) el.querySelector('.votes b').textContent = p.votes;
    });
  } catch {}
}

load();
setInterval(refreshCounts, 20000);
</script>
</body>
</html>
