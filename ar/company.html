<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الملف الاقتصادي — سمارت موني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<link rel="alternate" hreflang="en" href="/company">
<link rel="alternate" hreflang="ar" href="/ar/company">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232fd48a'/><text x='50' y='70' font-size='60' text-anchor='middle' font-family='monospace' font-weight='bold' fill='%2305261a'>S</text></svg>">
</head>
<body data-page="company">

<main class="wrap" id="main"></main>

<script src="/assets/data.js"></script>
<script src="/assets/data-ar.js"></script>
<script src="/assets/common.js"></script>
<script>
  const id = new URLSearchParams(location.search).get("id") || "aldeera";
  const c = SM.byId(id) || SM.byId("aldeera");
  document.title = c.name + " — سمارت موني";
  const f = c.financials, v = c.valuation, s = c.scores;

  const vb = (key) => f.verified.includes(key)
    ? '<span class="badge-verified">مُوثَّق</span>'
    : '<span class="badge-self">تصريح ذاتي</span>';

  const meter = (label, val, tone) => `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px">
        <span class="dim">${label}</span><span class="mono">${val}/100</span>
      </div>
      <div class="meter ${tone}"><i style="width:${val}%"></i></div>
    </div>`;

  const relLinks = (ids) => ids.length
    ? ids.map(r => { const rc = SM.byId(r); return `<a class="chip blue" href="/ar/company?id=${rc.id}">${rc.name}</a>`; }).join(" ")
    : '<span class="faint" style="font-size:13px">لا علاقات مرسومة بعد</span>';

  const myMatches = SM.matches.filter(m => m.a === c.id || m.b === c.id);

  const trendMax = Math.max(...f.trend), trendMin = Math.min(...f.trend);
  const trendSpan = trendMax - trendMin || 1;
  const spark = f.trend.map(t => `<i style="height:${Math.round(18 + 82 * (t - trendMin) / trendSpan)}%"></i>`).join("");
  const years = f.trend.map((_, i) => 2020 + i);

  document.getElementById("main").innerHTML = `
  <div class="profile-head">
    <div class="logo-tile" style="background:${c.color}">${c.short}</div>
    <div style="flex:1;min-width:260px">
      <h1>${c.name}</h1>
      <p class="dim" style="margin-top:4px">${c.about}</p>
      <div class="meta">
        <span class="chip">${c.industry}</span>
        <span class="chip">📍 ${c.location}</span>
        <span class="chip">تأسست ${c.founded}</span>
        <span class="chip">${c.employees} موظفًا</span>
        <span class="chip gold">${c.stage}</span>
        ${c.signals.map(sg => `<span class="chip green">● ${sg}</span>`).join("")}
      </div>
    </div>
  </div>

  <div class="split" style="margin-top:22px">
    <div><!-- MAIN COLUMN -->

      <div class="card">
        <div class="panel-title">الصحة المالية</div>
        <div class="grid grid-3">
          <div>
            <div class="faint" style="font-size:12px">الإيرادات ${vb("revenue")}</div>
            <div class="mono" style="font-size:20px;margin-top:4px">${SM.fmtKDfull(f.revenue)}</div>
          </div>
          <div>
            <div class="faint" style="font-size:12px">EBITDA ${vb("ebitda")}</div>
            <div class="mono" style="font-size:20px;margin-top:4px">${SM.fmtKDfull(f.ebitda)}</div>
          </div>
          <div>
            <div class="faint" style="font-size:12px">هامش EBITDA</div>
            <div class="mono" style="font-size:20px;margin-top:4px">${f.margin}%</div>
          </div>
          <div>
            <div class="faint" style="font-size:12px">التدفق النقدي التشغيلي</div>
            <div class="mono" style="font-size:20px;margin-top:4px">${SM.fmtKDfull(f.cashFlow)}</div>
          </div>
          <div>
            <div class="faint" style="font-size:12px">الديون ${vb("debt")}</div>
            <div class="mono" style="font-size:20px;margin-top:4px">${SM.fmtKDfull(f.debt)}</div>
          </div>
          <div>
            <div class="faint" style="font-size:12px">النمو السنوي</div>
            <div class="mono ${f.growth >= 10 ? "green" : ""}" style="font-size:20px;margin-top:4px">${f.growth >= 0 ? "+" : ""}${f.growth}%</div>
          </div>
        </div>
        <hr class="hr">
        <div class="faint" style="font-size:12px;margin-bottom:8px">اتجاه الإيرادات (ألف د.ك) · ${years[0]}–${years[years.length - 1]}</div>
        <div class="spark">${spark}</div>
        <div class="spark-years mono faint">
          ${years.map(y => `<span>${y}</span>`).join("")}
        </div>
        <hr class="hr">
        <p class="faint" style="font-size:12.5px">
          الإفصاح بيد الشركة. المؤشرات <span class="badge-verified">المُوثَّقة</span> تم التحقق منها
          مقابل قوائم مدققة أو بيانات بنكية؛ ومؤشرات <span class="badge-self">التصريح الذاتي</span> لم يتم التحقق منها.
        </p>
      </div>

      <div class="card">
        <div class="panel-title">محرك الفرص — الإشارات المنشورة</div>
        ${c.signals.map(sg => `
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)">
            <span>📣 ${sg}</span>
            <button class="btn btn-ghost btn-sm" onclick="this.textContent='✓ تم إرسال الطلب';this.disabled=true">استجب</button>
          </div>`).join("")}
        ${c.idleAssets.length ? `
          <div class="panel-title" style="margin-top:18px">أصول غير مستغلة (اكتشاف آلي)</div>
          ${c.idleAssets.map(a => `<p style="font-size:14px;padding:6px 0" class="dim">🧩 ${a}</p>`).join("")}` : ""}
      </div>

      ${myMatches.length ? `
      <div class="card">
        <div class="panel-title">مطابقات مصنوعة آليًا تخص ${c.name}</div>
        ${myMatches.map(m => {
          const other = SM.byId(m.a === c.id ? m.b : m.a);
          return `
          <div style="padding:12px 0;border-bottom:1px solid var(--line)">
            <div style="font-weight:600;font-size:14.5px">${m.icon} ${m.headline}
              — مع <a class="blue" href="/ar/company?id=${other.id}">${other.name}</a></div>
            <div class="dim" style="font-size:13.5px;margin-top:3px">${m.detail}</div>
            <div class="mono" style="font-size:13px;margin-top:6px">
              <span class="green">${SM.fmtKD(m.value)}</span> <span class="dim">${m.valueLabel}</span>
              · <span class="gold">ثقة ${m.confidence}%</span>
            </div>
          </div>`;
        }).join("")}
      </div>` : ""}

      <div class="card">
        <div class="panel-title">العلاقات الاقتصادية</div>
        <div class="kv" style="grid-template-columns:110px 1fr;text-align:start">
          <dt>الموردون</dt><dd style="text-align:start"><div class="tag-row">${relLinks(c.relationships.suppliers)}</div></dd>
          <dt>العملاء</dt><dd style="text-align:start"><div class="tag-row">${relLinks(c.relationships.customers)}</div></dd>
          <dt>المنافسون</dt><dd style="text-align:start"><div class="tag-row">${relLinks(c.relationships.competitors)}</div></dd>
        </div>
        <p style="margin-top:16px"><a class="btn btn-ghost btn-sm" href="/ar/graph?focus=${c.id}">اعرضها في الشبكة الاقتصادية ←</a></p>
      </div>

    </div>
    <div><!-- SIDE COLUMN -->

      <div class="card" style="border-color:rgba(47,212,138,.35)">
        <div class="panel-title">تقييم الأعمال بالذكاء الاصطناعي</div>
        <div style="font-family:var(--font-display);font-size:26px;font-weight:700">
          ${SM.fmtRange(v.low, v.high)}
        </div>
        <div class="dim" style="font-size:13px;margin-top:2px">نطاق قيمة المنشأة المقترح · نقطة الوسط ${SM.fmtKD(v.point)}</div>
        <div class="range-bar">
          <span class="band" style="left:8%;right:8%"></span>
          <span class="tick" style="left:${8 + 84 * (v.point - v.low) / (v.high - v.low)}%"></span>
        </div>
        <div class="range-labels"><span>${SM.fmtKD(v.low)}</span><span class="gold">نقطة الوسط</span><span>${SM.fmtKD(v.high)}</span></div>
        <hr class="hr">
        <div class="kv">
          <dt>الثقة</dt><dd class="${v.confidence === "High" ? "green" : v.confidence === "Medium" ? "gold" : "red"}">${v.confidenceAr || v.confidence}</dd>
          <dt>المنهجية</dt><dd style="white-space:normal;max-width:200px">${v.method}</dd>
        </div>
        <hr class="hr">
        <p class="faint" style="font-size:12px;line-height:1.6">
          تقدير نموذج لدعم القرار — ليس تقييمًا معتمدًا ولا عرضًا ولا نصيحة استثمارية.
          يُفصح عن الافتراضات ومجموعات المقارنة للمشتركين.
        </p>
      </div>

      <div class="card">
        <div class="panel-title">درجات الجاهزية والمخاطر</div>
        ${meter("درجة النمو", s.growth, "green")}
        ${meter("الجاهزية الاستثمارية", s.investment, "blue")}
        ${meter("جاهزية الاستحواذ", s.acquisition, "violet")}
        ${meter("ملف المخاطر (الأقل أكثر أمانًا)", s.risk, "red")}
        ${meter("درجة الفرص", s.opportunity, "gold")}
      </div>

      <div class="card">
        <div class="panel-title">الهوية</div>
        <div class="kv">
          <dt>الملكية</dt><dd style="white-space:normal;max-width:180px">${c.ownership}</dd>
          <dt>الأسواق</dt><dd>${c.markets.join("، ")}</dd>
          <dt>الشهادات</dt><dd style="white-space:normal;max-width:180px">${c.certifications.length ? c.certifications.join("، ") : "—"}</dd>
        </div>
      </div>

      <div class="card" style="background:linear-gradient(160deg,var(--panel),#12251c)">
        <div class="panel-title">المرحلة 3 · وصول موثّق</div>
        <p style="font-size:14px" class="dim">يمكن للمستثمرين الموثّقين طلب الوصول إلى غرفة البيانات السرية للفحص النافي للجهالة — تحت اتفاقية عدم إفصاح ومع التحقق من الهوية.</p>
        <button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="this.textContent='✓ تم إرسال طلب التوثيق';this.disabled=true">اطلب الوصول لغرفة البيانات</button>
      </div>

    </div>
  </div>

  <p style="margin:26px 0 10px"><a class="dim" href="/ar/companies">→ عودة إلى الدليل</a></p>
  `;
</script>
</body>
</html>
