<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Profile — Smart Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232fd48a'/><text x='50' y='70' font-size='60' text-anchor='middle' font-family='monospace' font-weight='bold' fill='%2305261a'>S</text></svg>">
</head>
<body data-page="company">

<main class="wrap" id="main"></main>

<script src="/assets/data.js"></script>
<script src="/assets/common.js"></script>
<script>
  const id = new URLSearchParams(location.search).get("id") || "aldeera";
  const c = SM.byId(id) || SM.byId("aldeera");
  document.title = c.name + " — Smart Money";
  const f = c.financials, v = c.valuation, s = c.scores;

  const vb = (key) => f.verified.includes(key)
    ? '<span class="badge-verified">VERIFIED</span>'
    : '<span class="badge-self">SELF-REPORTED</span>';

  const meter = (label, val, tone) => `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px">
        <span class="dim">${label}</span><span class="mono">${val}/100</span>
      </div>
      <div class="meter ${tone}"><i style="width:${val}%"></i></div>
    </div>`;

  const relLinks = (ids) => ids.length
    ? ids.map(r => { const rc = SM.byId(r); return `<a class="chip blue" href="/company?id=${rc.id}">${rc.name}</a>`; }).join(" ")
    : '<span class="faint" style="font-size:13px">None mapped yet</span>';

  const myMatches = SM.matches.filter(m => m.a === c.id || m.b === c.id);

  const trendMax = Math.max(...f.trend), trendMin = Math.min(...f.trend);
  const trendSpan = trendMax - trendMin || 1;
  const spark = f.trend.map(t => `<i style="height:${Math.round(18 + 82 * (t - trendMin) / trendSpan)}%"></i>`).join("");
  const years = f.trend.map((_, i) => 2020 + i);

  document.getElementById("main").innerHTML = `
  <div class="profile-head">
    <div class="logo-tile" style="background:${c.color}">${c.short}</div>
    <div style="flex:1;min-width:260px">
      <h1>${c.name}</h1>
      <p class="dim" style="margin-top:4px">${c.about}</p>
      <div class="meta">
        <span class="chip">${c.industry}</span>
        <span class="chip">📍 ${c.location}</span>
        <span class="chip">Est. ${c.founded}</span>
        <span class="chip">${c.employees} employees</span>
        <span class="chip gold">${c.stage}</span>
        ${c.signals.map(sg => `<span class="chip green">● ${sg}</span>`).join("")}
      </div>
    </div>
  </div>

  <div class="split" style="margin-top:22px">
    <div><!-- LEFT COLUMN -->

      <div class="card">
        <div class="panel-title">Financial Health</div>
        <div class="grid grid-3">
          <div>
            <div class="faint" style="font-size:12px">REVENUE ${vb("revenue")}</div>
            <div class="mono" style="font-size:20px;margin-top:4px">${SM.fmtKDfull(f.revenue)}</div>
          </div>
          <div>
            <div class="faint" style="font-size:12px">EBITDA ${vb("ebitda")}</div>
            <div class="mono" style="font-size:20px;margin-top:4px">${SM.fmtKDfull(f.ebitda)}</div>
          </div>
          <div>
            <div class="faint" style="font-size:12px">EBITDA MARGIN</div>
            <div class="mono" style="font-size:20px;margin-top:4px">${f.margin}%</div>
          </div>
          <div>
            <div class="faint" style="font-size:12px">OPERATING CASH FLOW</div>
            <div class="mono" style="font-size:20px;margin-top:4px">${SM.fmtKDfull(f.cashFlow)}</div>
          </div>
          <div>
            <div class="faint" style="font-size:12px">DEBT ${vb("debt")}</div>
            <div class="mono" style="font-size:20px;margin-top:4px">${SM.fmtKDfull(f.debt)}</div>
          </div>
          <div>
            <div class="faint" style="font-size:12px">YOY GROWTH</div>
            <div class="mono ${f.growth >= 10 ? "green" : ""}" style="font-size:20px;margin-top:4px">${f.growth >= 0 ? "+" : ""}${f.growth}%</div>
          </div>
        </div>
        <hr class="hr">
        <div class="faint" style="font-size:12px;margin-bottom:8px">REVENUE TREND (K KD) · ${years[0]}–${years[years.length - 1]}</div>
        <div class="spark">${spark}</div>
        <div class="spark-years mono faint">
          ${years.map(y => `<span>${y}</span>`).join("")}
        </div>
        <hr class="hr">
        <p class="faint" style="font-size:12.5px">
          Disclosure is controlled by the company. <span class="badge-verified">VERIFIED</span> metrics are confirmed
          against audited statements or bank data; <span class="badge-self">SELF-REPORTED</span> metrics are not.
        </p>
      </div>

      <div class="card">
        <div class="panel-title">Opportunity Engine — Published Signals</div>
        ${c.signals.map(sg => `
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)">
            <span>📣 ${sg}</span>
            <button class="btn btn-ghost btn-sm" onclick="this.textContent='✓ Request sent';this.disabled=true">Respond</button>
          </div>`).join("")}
        ${c.idleAssets.length ? `
          <div class="panel-title" style="margin-top:18px">Underutilized Assets (AI-detected)</div>
          ${c.idleAssets.map(a => `<p style="font-size:14px;padding:6px 0" class="dim">🧩 ${a}</p>`).join("")}` : ""}
      </div>

      ${myMatches.length ? `
      <div class="card">
        <div class="panel-title">AI-Manufactured Matches Involving ${c.name}</div>
        ${myMatches.map(m => {
          const other = SM.byId(m.a === c.id ? m.b : m.a);
          return `
          <div style="padding:12px 0;border-bottom:1px solid var(--line)">
            <div style="font-weight:600;font-size:14.5px">${m.icon} ${m.headline}
              — with <a class="blue" href="/company?id=${other.id}">${other.name}</a></div>
            <div class="dim" style="font-size:13.5px;margin-top:3px">${m.detail}</div>
            <div class="mono" style="font-size:13px;margin-top:6px">
              <span class="green">${SM.fmtKD(m.value)}</span> <span class="dim">${m.valueLabel}</span>
              · <span class="gold">${m.confidence}% confidence</span>
            </div>
            ${m.why && m.why.length ? `<details class="why"><summary>Why this match?</summary>
              <ul>${m.why.map(w => `<li>${w}</li>`).join("")}</ul></details>` : ""}
          </div>`;
        }).join("")}
      </div>` : ""}

      <div class="card">
        <div class="panel-title">Economic Relationships</div>
        <div class="kv" style="grid-template-columns:110px 1fr;text-align:left">
          <dt>Suppliers</dt><dd style="text-align:left"><div class="tag-row">${relLinks(c.relationships.suppliers)}</div></dd>
          <dt>Customers</dt><dd style="text-align:left"><div class="tag-row">${relLinks(c.relationships.customers)}</div></dd>
          <dt>Competitors</dt><dd style="text-align:left"><div class="tag-row">${relLinks(c.relationships.competitors)}</div></dd>
        </div>
        <p style="margin-top:16px"><a class="btn btn-ghost btn-sm" href="/graph?focus=${c.id}">View in the economic graph →</a></p>
      </div>

    </div>
    <div><!-- RIGHT COLUMN -->

      <div class="card" style="border-color:rgba(47,212,138,.35)">
        <div class="panel-title">AI Business Valuation</div>
        <div style="font-family:var(--font-display);font-size:28px;font-weight:700">
          ${SM.fmtKD(v.low)} <span class="dim" style="font-size:18px">–</span> ${SM.fmtKD(v.high)}
        </div>
        <div class="dim" style="font-size:13px;margin-top:2px">Suggested enterprise value range · midpoint ${SM.fmtKD(v.point)}</div>
        <div class="range-bar">
          <span class="band" style="left:8%;right:8%"></span>
          <span class="tick" style="left:${8 + 84 * (v.point - v.low) / (v.high - v.low)}%"></span>
        </div>
        <div class="range-labels"><span>${SM.fmtKD(v.low)}</span><span class="gold">midpoint</span><span>${SM.fmtKD(v.high)}</span></div>
        <hr class="hr">
        <div class="kv">
          <dt>Confidence</dt><dd class="${v.confidence === "High" ? "green" : v.confidence === "Medium" ? "gold" : "red"}">${v.confidence}</dd>
          <dt>Method</dt><dd style="white-space:normal;max-width:200px">${v.method}</dd>
        </div>
        <hr class="hr">
        <p class="faint" style="font-size:12px;line-height:1.5">
          Model estimate for decision support — not a certified appraisal, offer, or investment advice.
          Assumptions and comparable sets are disclosed to subscribers.
        </p>
      </div>

      <div class="card">
        <div class="panel-title">Readiness &amp; Risk Scores</div>
        ${meter("Growth score", s.growth, "green")}
        ${meter("Investment readiness", s.investment, "blue")}
        ${meter("Acquisition readiness", s.acquisition, "violet")}
        ${meter("Risk profile (lower is safer)", s.risk, "red")}
        ${meter("Opportunity score", s.opportunity, "gold")}
        <details class="why"><summary>What do these scores mean?</summary>
          <ul>
            <li><b>Growth</b> — revenue trajectory vs sector peers.</li>
            <li><b>Investment readiness</b> — how prepared the company is for outside capital: disclosure quality, growth, governance.</li>
            <li><b>Acquisition readiness</b> — how transactable it is: clean ownership, stable cash flow, succession posture.</li>
            <li><b>Risk</b> — concentration, leverage, and volatility signals. Lower is safer.</li>
            <li><b>Opportunity</b> — how much near-term value the graph currently sees around this company.</li>
          </ul>
        </details>
      </div>

      <div class="card">
        <div class="panel-title">Identity</div>
        <div class="kv">
          <dt>Ownership</dt><dd style="white-space:normal;max-width:180px">${c.ownership}</dd>
          <dt>Markets</dt><dd>${c.markets.join(", ")}</dd>
          <dt>Certifications</dt><dd style="white-space:normal;max-width:180px">${c.certifications.length ? c.certifications.join(", ") : "—"}</dd>
        </div>
      </div>

      <div class="card" style="background:linear-gradient(160deg,var(--panel),#12251c)">
        <div class="panel-title">Phase 3 · Verified Access</div>
        <p style="font-size:14px" class="dim">Verified investors can request access to the confidential data room for due diligence — under NDA, with KYC checks.</p>
        <button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="this.textContent='✓ Verification request submitted';this.disabled=true">Request data room access</button>
      </div>

    </div>
  </div>

  <p style="margin:26px 0 10px"><a class="dim" href="/companies">← Back to directory</a></p>
  `;
</script>
</body>
</html>
